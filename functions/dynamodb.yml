dynamo-add-name-tag:
  handler: src/handlers/dynamodb_handler.add_name_tag
  timeout: 300
  memorySize: 256
  events:
    - schedule:
        rate: cron(0 3 * * ? *) # 00:00 UTC-3
        enabled: ${self:provider.environment.SCHEDULE_FROM_DYNAMO_IS_ENABLED}

list-tables-without-replication:
  handler: src/handlers/dynamodb_handler.list_tables_without_replication
  timeout: 300
  memorySize: 256
  events:
    - schedule:
        rate: cron(0 3 * * ? *) # 00:00 UTC-3
        enabled: ${self:provider.environment.SCHEDULE_FROM_DYNAMO_IS_ENABLED}

enable-deletion-protection:
  handler: src/handlers/dynamodb_handler.enable_protection
  timeout: 300
  memorySize: 256
  events:
    - schedule:
        rate: cron(0 21 * * ? *) # 18:00 UTC-3
        enabled: ${self:provider.environment.SCHEDULE_FROM_DYNAMO_IS_ENABLED}

export-companies-to-csv:
  handler: src/handlers/dynamodb_handler.export_companies_to_csv
  timeout: 300
  memorySize: 256
  events:
    - schedule:
        rate: cron(0 21 * * ? *) # 18:00 UTC-3
        enabled: ${self:provider.environment.SCHEDULE_FROM_DYNAMO_IS_ENABLED}

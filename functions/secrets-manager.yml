secret-add-name-tag:
  handler: src/handlers/secrets_manager_handler.add_name_tag
  timeout: 300
  memorySize: 256
  events:
    - schedule:
        rate: cron(0 3 * * ? *) # 00:00 UTC-3
        enabled: ${self:provider.environment.SCHEDULE_FROM_SECRETS_MANAGER_IS_ENABLED}

delete-unused-secret:
  handler: src/handlers/secrets_manager_handler.unused_secrets
  timeout: 300
  memorySize: 256
  events:
    - schedule:
        rate: cron(0 3 * * ? *) # 00:00 UTC-3
        enabled: ${self:provider.environment.SCHEDULE_FROM_SECRETS_MANAGER_IS_ENABLED}

replicate-secret:
  handler: src/handlers/secrets_manager_handler.replicate_secret
  timeout: 300
  memorySize: 256
  events:
    - schedule:
        rate: cron(0 3 * * ? *) # 00:00 UTC-3
        enabled: ${self:provider.environment.REPLICATE_SECRETS_IS_ENABLED}
